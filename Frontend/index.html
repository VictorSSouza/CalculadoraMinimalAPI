<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora API</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">
        <h2>Calculadora</h2>

        <input type="number" id="num1" placeholder="Primeiro número" required>

        <select id="operation">
            <option value="+">Somar (+)</option>
            <option value="-">Subtrair (-)</option>
            <option value="*">Multiplicar (×)</option>
            <option value="/">Dividir (÷)</option>
        </select>

        <input type="number" id="num2" placeholder="Segundo número" required>

        <button onclick="calculate()">Calcular</button>

        <div class="result-container">
            <span>Resultado:</span><br>
            <span id="result">---</span>
        </div>

        <div class="history-container">
            <h3>Histórico</h3>
            <button class="btn-secondary" onclick="loadHistory()">Carregar Histórico</button>
            <ul id="historyList"></ul>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>

</body>

</html>
